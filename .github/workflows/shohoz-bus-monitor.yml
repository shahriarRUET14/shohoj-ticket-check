# Shohoz Bus Trip Monitor — GitHub Actions
#
# Runs `main.py` on a schedule and on demand. Trip-count baselines live in
# `storage/state.json` and are persisted across runs using `actions/cache` (best-effort).
#
# Cron (UTC): `0 * * * *` → at **minute 0** of every hour (e.g. 01:00 UTC, 02:00 UTC).
# GitHub may start scheduled jobs a few minutes late under load; see README.
name: Shohoz Bus Trip Monitor

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  # Required so `actions/cache` can save restored workflow caches on successful jobs.
  actions: write

concurrency:
  group: shohoz-bus-monitor-${{ github.repository }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Ensure storage directory exists
        run: mkdir -p storage

      # Restore the last saved `storage/state.json` so trip counts can be compared run-to-run.
      # Key includes run_id so each run writes a fresh cache entry; restore-keys pulls the latest prior.
      - name: Restore trip-count state (cache)
        uses: actions/cache@v4
        id: trip_state_cache
        with:
          path: storage/state.json
          key: shohoz-state-${{ github.run_id }}
          restore-keys: |
            shohoz-state-

      - name: Print Python and pip versions
        run: |
          set -euo pipefail
          echo "Python: $(python --version)"
          echo "Pip: $(pip --version)"

      - name: Install dependencies from requirements.txt
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Never print the secret. Only confirm presence so beginners catch a missing secret early.
      - name: Check DISCORD_WEBHOOK secret is configured (value hidden)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "::warning::DISCORD_WEBHOOK is not set. Shohoz checks will run, but Discord alerts on trip-count changes will fail until you add this repository secret."
          else
            echo "DISCORD_WEBHOOK secret is set (value not shown)."
          fi

      - name: Run monitor (main.py)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          OVERRIDE_DATE: ${{ secrets.OVERRIDE_DATE }}
          NOTIFY_ON_BASELINE: ${{ vars.NOTIFY_ON_BASELINE }}
        run: |
          set -euo pipefail
          python main.py 2>&1 | tee monitor_run.log

      - name: Upload monitor log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shohoz-monitor-log-${{ github.run_id }}
          path: monitor_run.log
          if-no-files-found: warn
