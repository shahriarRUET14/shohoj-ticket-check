# Shohoz Bus Trip Monitor — GitHub Actions
#
# Runs `main.py` on a schedule and on demand. Trip-count baselines live in
# `storage/state.json` and are persisted across runs using `actions/cache` (best-effort).
#
# Cron (UTC): `*/5 * * * *` → about every **5 minutes** (GitHub may start late).
# High-frequency schedules use more Actions minutes; see README.
name: Shohoz Bus Trip Monitor

on:
#  schedule:
#    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: shohoz-bus-monitor-${{ github.repository }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Ensure storage directory exists
        run: mkdir -p storage

      - name: Restore trip-count state (cache)
        uses: actions/cache@v4
        id: trip_state_cache
        with:
          path: storage/state.json
          key: shohoz-state-${{ github.run_id }}
          restore-keys: |
            shohoz-state-

      - name: Print Python and pip versions
        run: |
          set -euo pipefail
          echo "Python: $(python --version)"
          echo "Pip: $(pip --version)"

      - name: Install dependencies from requirements.txt
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Require DISCORD_WEBHOOK secret (value hidden)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "::error::Add repository secret DISCORD_WEBHOOK. Required for Discord (summary each run when DISCORD_NOTIFY_EVERY_CHECK is true)."
            exit 1
          fi
          echo "DISCORD_WEBHOOK is configured (value not shown)."

      # Configure boolean without blank env overriding defaults:
      # - Repository Variable DISCORD_NOTIFY_EVERY_CHECK: true/false/1/0 (preferred)
      # - Or legacy Variable DISCORD_REPORT_EVERY_RUN if the primary is unset
      - name: Run monitor (main.py)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          OVERRIDE_DATE: ${{ secrets.OVERRIDE_DATE }}
          NOTIFY_ON_BASELINE: ${{ vars.NOTIFY_ON_BASELINE }}
        run: |
          set -euo pipefail
          VM="${{ vars.DISCORD_NOTIFY_EVERY_CHECK }}"
          VL="${{ vars.DISCORD_REPORT_EVERY_RUN }}"
          if [ -n "${VM:-}" ]; then
            export DISCORD_NOTIFY_EVERY_CHECK="$VM"
          elif [ -n "${VL:-}" ]; then
            export DISCORD_REPORT_EVERY_RUN="$VL"
          else
            export DISCORD_NOTIFY_EVERY_CHECK="true"
          fi
          python main.py 2>&1 | tee monitor_run.log

      - name: Upload monitor log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shohoz-monitor-log-${{ github.run_id }}
          path: monitor_run.log
          if-no-files-found: warn
